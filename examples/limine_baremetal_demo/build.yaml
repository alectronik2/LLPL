      - {path: user/tinygl/src/accum.c, output: build/tinygl_accum.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/zpostprocess.c, output: build/tinygl_zpostprocess.o, cflags: *tinygl_flags}
    output: build/libTinyGL.a

