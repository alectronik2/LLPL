# Build config for the Limine-booted bare-metal demo - replaces the old
# Makefile. Run with ../../tools/llplbuild/llplbuild (build|run|clean|configs)
# from within this directory.
#
# Override where Limine's own assets/tooling live with
#   ../../tools/llplbuild/llplbuild build --var LIMINE_DIR=/path/to/limine
# (or the LIMINE_DIR environment variable).

project: llpl-limine-baremetal-demo
entry: kernel.llpl
generated_c: build/kernel.c
llpl_compiler: ../../llpl

variables:
  LIMINE_DIR: /usr/share/limine

toolchain:
  m64: ../../tools/assembler/build/m64
  cc: tcc
  ld: ld
  qemu: qemu-system-x86_64

common_cflags:
  - -m64
  - -ffreestanding
  - -nostdlib
  - -nostdinc
  - -fno-builtin
  - -fno-stack-protector
  - -fno-omit-frame-pointer
  - -fno-optimize-sibling-calls
  - -Iuser/include
  - -Ibuild/include
  - -mcmodel=kernel
  - -fno-pie
  - -mno-red-zone
  # runtime.c enables its %f formatter when it sees TCC, but this kernel
  # deliberately disables all FP/SSE state. Hide TCC's marker for these
  # freestanding objects so runtime.c compiles out the double-taking helper.
  - -U__TINYC__
  - -mno-sse
  - -mno-sse2
  - -mno-mmx
  - -mno-80387

default_config: final
configurations:
  debug:
    cflags: [-O0, -g]
  final:
    cflags: [-O2]

c_sources:
  - path: build/kernel.c
    output: build/kernel.o
    include_dirs: [../../runtime]
  - path: ../../runtime/runtime.c
    output: build/runtime.o
    include_dirs: [../../runtime]

m64_sources:
  - src: hal/isr.m64
    output: build/isr.o

link:
  output: kernel.elf
  script: linker.ld
  ldflags: [-m, elf_x86_64, -nostdlib]
  objects: [build/kernel.o, build/runtime.o, build/isr.o]

static_libraries:
  - name: libsys
    c_sources:
      - path: user/lib/syscall.c
        output: build/libsys_syscall.o
        cflags: [-mcmodel=small, -fno-pie]
      - path: user/lib/stdio.c
        output: build/libsys_stdio.o
        cflags: [-mcmodel=small, -fno-pie]
      - path: user/lib/malloc.c
        output: build/libsys_malloc.o
        cflags: [-mcmodel=small, -fno-pie]
      - path: user/lib/args.c
        output: build/libsys_args.o
        cflags: [-mcmodel=small, -fno-pie]
      - path: user/lib/libc.c
        output: build/libsys_libc.o
        cflags: [-mcmodel=small, -fno-pie, -msse, -msse2, -mfpmath=sse]
    output: build/libsys.a
  - name: tinygl
    c_sources:
      - {path: user/tinygl/src/api.c, output: build/tinygl_api.o, cflags: &tinygl_flags [-mcmodel=small, -fno-pie, -msse, -msse2, -mfpmath=sse, -DNO_DEBUG_OUTPUT]}
      - {path: user/tinygl/src/list.c, output: build/tinygl_list.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/vertex.c, output: build/tinygl_vertex.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/init.c, output: build/tinygl_init.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/matrix.c, output: build/tinygl_matrix.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/texture.c, output: build/tinygl_texture.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/misc.c, output: build/tinygl_misc.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/clear.c, output: build/tinygl_clear.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/light.c, output: build/tinygl_light.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/clip.c, output: build/tinygl_clip.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/select.c, output: build/tinygl_select.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/get.c, output: build/tinygl_get.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/zbuffer.c, output: build/tinygl_zbuffer.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/zline.c, output: build/tinygl_zline.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/ztriangle.c, output: build/tinygl_ztriangle.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/zmath.c, output: build/tinygl_zmath.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/image_util.c, output: build/tinygl_image_util.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/msghandling.c, output: build/tinygl_msghandling.o, cflags: *tinygl_flags}
      - {path: user/tinygl/src/arrays.c, output: build/tinygl_arrays.o, cflags: *tinygl_flags}
