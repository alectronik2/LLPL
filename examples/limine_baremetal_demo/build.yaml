      - {path: user/lua-5.4.9/src/ltm.c, output: build/lua_ltm.o, cflags: [-mcmodel=small, -fno-pie, -msse, -msse2, -mfpmath=sse, -DLUA_USE_C89]}
      - {path: user/lua-5.4.9/src/lundump.c, output: build/lua_lundump.o, cflags: [-mcmodel=small, -fno-pie, -msse, -msse2, -mfpmath=sse, -DLUA_USE_C89]}
      - {path: user/lua-5.4.9/src/lutf8lib.c, output: build/lua_lutf8lib.o, cflags: [-mcmodel=small, -fno-pie, -msse, -msse2, -mfpmath=sse, -DLUA_USE_C89]}
      - {path: user/lua-5.4.9/src/lvm.c, output: build/lua_lvm.o, cflags: [-mcmodel=small, -fno-pie, -msse, -msse2, -mfpmath=sse, -DLUA_USE_C89]}
      - {path: user/lua-5.4.9/src/lzio.c, output: build/lua_lzio.o, cflags: [-mcmodel=small, -fno-pie, -msse, -msse2, -mfpmath=sse, -DLUA_USE_C89]}
    link:
      output: build/lua.elf
      script: user/linker.ld
      ldflags: [-m, elf_x86_64, -nostdlib, -static]
      objects: [build/lua_main.o, build/lua_lapi.o, build/lua_lauxlib.o, build/lua_lbaselib.o, build/lua_lcode.o, build/lua_lcorolib.o, build/lua_lctype.o, build/lua_ldblib.o, build/lua_ldebug.o, build/lua_ldo.o, build/lua_ldump.o, build/lua_lfunc.o, build/lua_lgc.o, build/lua_linit.o, build/lua_liolib.o, build/lua_llex.o, build/lua_lmathlib.o, build/lua_lmem.o, build/lua_loadlib.o, build/lua_lobject.o, build/lua_lopcodes.o, build/lua_loslib.o, build/lua_lparser.o, build/lua_lstate.o, build/lua_lstring.o, build/lua_lstrlib.o, build/lua_ltable.o, build/lua_ltablib.o, build/lua_ltm.o, build/lua_lundump.o, build/lua_lutf8lib.o, build/lua_lvm.o, build/lua_lzio.o, build/libsys.a]

  - name: editor
    c_sources:
      - path: user/editor.c
        output: build/editor.o
        cflags: [-mcmodel=small, -fno-pie]
    link:
      output: build/editor.elf
      script: user/linker.ld
      ldflags: [-m, elf_x86_64, -nostdlib, -static]
      objects: [build/editor.o, build/libsys.a]
  - name: kilo
    c_sources:
      - path: user/kilo.c
        output: build/kilo.o
        cflags: [-mcmodel=small, -fno-pie]
    link:
      output: build/kilo.elf
      script: user/linker.ld
      ldflags: [-m, elf_x86_64, -nostdlib, -static]
      objects: [build/kilo.o, build/libsys.a]
  - name: tinygl_demo
    c_sources:
      - path: user/tinygl_demo.c
        output: build/tinygl_demo.o
        cflags: [-mcmodel=small, -fno-pie, -msse, -msse2, -mfpmath=sse]
    link:
      output: build/tinygl_demo.elf
      script: user/linker.ld
      ldflags: [-m, elf_x86_64, -nostdlib, -static]
      objects: [build/tinygl_demo.o, build/libTinyGL.a, build/libsys.a]

package:
  output: kernel.iso
  run_only: true
  actions:
    # Replaces the old Makefile's `check-limine` target - fails fast,
    # before doing any ISO work, if Limine's assets/tooling aren't where
    # LIMINE_DIR says they are.
    - require_file:
        path: "${LIMINE_DIR}/limine-bios.sys"
        message: "Limine assets not found in LIMINE_DIR=${LIMINE_DIR} - install Limine, or run: llplbuild build --var LIMINE_DIR=/path/to/limine"
    - require_file:
        path: "${LIMINE_DIR}/limine-bios-cd.bin"
        message: "Missing ${LIMINE_DIR}/limine-bios-cd.bin"
    - require_file:
        path: "${LIMINE_DIR}/limine-uefi-cd.bin"
        message: "Missing ${LIMINE_DIR}/limine-uefi-cd.bin"
    - require_file:
        path: "${LIMINE_DIR}/limine"
        message: "Missing ${LIMINE_DIR}/limine"
    - mkdir: isodir/boot/limine
    - mkdir: isodir/EFI/BOOT
    - copy: {from: kernel.elf, to: isodir/boot/kernel.elf}
    - mkdir: initrd/bin
    - copy: {from: build/init.elf, to: initrd/bin/init}
    - copy: {from: build/child.elf, to: initrd/bin/child}
    - copy: {from: build/execer.elf, to: initrd/bin/execer}
    - copy: {from: build/fdinherit.elf, to: initrd/bin/fdinherit}
    - copy: {from: build/fdcheck.elf, to: initrd/bin/fdcheck}
    - copy: {from: build/kbd_echo.elf, to: initrd/bin/kbd_echo}
    - copy: {from: build/mouse_demo.elf, to: initrd/bin/mouse_demo}
    - copy: {from: build/shell.elf, to: initrd/bin/sh}
    - copy: {from: build/shm_writer.elf, to: initrd/bin/shm_writer}
    - copy: {from: build/shm_reader.elf, to: initrd/bin/shm_reader}
    - copy: {from: build/apc_target.elf, to: initrd/bin/apc_target}
    - copy: {from: build/apc_sender.elf, to: initrd/bin/apc_sender}
    - copy: {from: build/seh_demo.elf, to: initrd/bin/seh_demo}
    - copy: {from: build/wait_target.elf, to: initrd/bin/wait_target}
    - copy: {from: build/wait_demo.elf, to: initrd/bin/wait_demo}
    - copy: {from: build/iocp_demo.elf, to: initrd/bin/iocp_demo}
    - copy: {from: build/sync_handle_demo.elf, to: initrd/bin/sync_handle_demo}
    - copy: {from: build/pipe_writer_demo.elf, to: initrd/bin/pipe_writer_demo}
    - copy: {from: build/pipe_reader_demo.elf, to: initrd/bin/pipe_reader_demo}
    - copy: {from: build/pipe_pipeline_demo.elf, to: initrd/bin/pipe_pipeline_demo}
    - copy: {from: build/pipe_simple_demo.elf, to: initrd/bin/pipe_simple_demo}
    - copy: {from: build/hello.elf, to: initrd/bin/hello}
    - copy: {from: build/dhcp.elf, to: initrd/bin/dhcp}
    - copy: {from: build/ping.elf, to: initrd/bin/ping}
    - copy: {from: build/traceroute.elf, to: initrd/bin/traceroute}
    - copy: {from: build/fetch.elf, to: initrd/bin/fetch}
    - copy: {from: build/lua.elf, to: initrd/bin/lua}
    - copy: {from: build/editor.elf, to: initrd/bin/edit}
    - copy: {from: build/kilo.elf, to: initrd/bin/kilo}
    - copy: {from: build/tinygl_demo.elf, to: initrd/bin/tinygl}
    - mkdir: initrd/etc
    - copy: {from: user/lua_smoke.lua, to: initrd/etc/lua_smoke.lua}
    - copy: {from: assets/wallpaper.raw, to: initrd/etc/wallpaper.raw}
    - copy: {from: assets/cursor.raw, to: initrd/etc/cursor.raw}
    - run: "tar -C initrd -cf isodir/boot/initrd.tar ."
    - copy: {from: limine.conf, to: isodir/limine.conf}
    - copy: {from: limine.conf, to: isodir/boot/limine/limine.conf}
    - copy: {from: "${LIMINE_DIR}/limine-bios.sys", to: isodir/boot/limine/limine-bios.sys}
    - copy: {from: "${LIMINE_DIR}/limine-bios-cd.bin", to: isodir/boot/limine/limine-bios-cd.bin}
    - copy: {from: "${LIMINE_DIR}/limine-uefi-cd.bin", to: isodir/boot/limine/limine-uefi-cd.bin}
    - copy: {from: "${LIMINE_DIR}/BOOTX64.EFI", to: isodir/EFI/BOOT/BOOTX64.EFI}
      allow_failure: true
    - run: "xorriso -as mkisofs -b boot/limine/limine-bios-cd.bin -no-emul-boot -boot-load-size 4 -boot-info-table --efi-boot boot/limine/limine-uefi-cd.bin -efi-boot-part --efi-boot-image --protective-msdos-label isodir -o kernel.iso"
    - run: "${LIMINE_DIR}/limine bios-install kernel.iso"

persistent_files:
  - path: disk.img
    create: "dd if=/dev/zero of=disk.img bs=1M count=16"

run:
  args: ["-cdrom", "kernel.iso", "-serial", "stdio", "-m", "256", "-accel", "kvm",
    "-nic", "user,model=e1000",
    "-device", "ahci,id=ahci0",
    "-drive", "id=disk0,file=disk.img,format=raw,if=none",
    "-device", "ide-hd,drive=disk0,bus=ahci0.0"]
